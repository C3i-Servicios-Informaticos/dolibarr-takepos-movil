services:
  mariadb:
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dolidb
      MYSQL_USER: dolidbuser
      MYSQL_PASSWORD: dolidbpass
    volumes:
      - mariadb_data:/var/lib/mysql

  web:
    image: dolibarr/dolibarr:16
    depends_on:
      - mariadb
    environment:
      DOLI_INSTALL_AUTO: 1
      DOLI_DB_HOST: mariadb
      DOLI_DB_NAME: dolidb
      DOLI_DB_USER: dolidbuser
      DOLI_DB_PASSWORD: dolidbpass
      DOLI_URL_ROOT: "http://0.0.0.0"
      DOLI_ADMIN_LOGIN: admin
      DOLI_ADMIN_PASSWORD: admin
    ports:
      - "80:80"
    volumes:
      - dolibarr_documents:/var/www/documents
      - dolibarr_custom:/var/www/html/custom

volumes:
  mariadb_data:
  dolibarr_documents:
  dolibarr_custom:
